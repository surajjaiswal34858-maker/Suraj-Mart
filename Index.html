<!DOCT<!DOCTYPE html>
<html>
<head>
  <title>Suraj Mart Pro</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f1f3f6;
    }

    header {
      background: #2874f0;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      color: white;
    }

    header input {
      width: 60%;
      padding: 5px;
      border-radius: 5px;
      border: none;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    button {
      background: #fb641b;
      border: none;
      color: white;
      padding: 6px;
      margin-top: 5px;
      border-radius: 5px;
    }

    .cart {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      padding: 10px;
      border-top: 2px solid #ccc;
    }
  </style>
</head>

<body>

<header>
  <b>Suraj Mart</b>
  <input type="text" id="search" placeholder="Search..." onkeyup="search()">
</header>

<div class="products" id="productList">

  <div class="card" data-name="tshirt">
    <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
    <h4>T-Shirt</h4>
    <p>₹499</p>
    <button onclick="addCart('T-Shirt',499)">Add</button>
  </div>

  <div class="card" data-name="shoes">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
    <h4>Shoes</h4>
    <p>₹999</p>
    <button onclick="addCart('Shoes',999)">Add</button>
  </div>

</div>

<div class="cart">
  🛒 Items: <span id="count">0</span> |
  💰 ₹<span id="total">0</span>
  <button onclick="order()">Order</button>
</div>

<script>
let cart = [];
let total = 0;

function addCart(name, price){
  cart.push({name, price});
  total += price;

  document.getElementById("count").innerText = cart.length;
  document.getElementById("total").innerText = total;
}

function search(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let name = card.getAttribute("data-name");
    card.style.display = name.includes(input) ? "block" : "none";
  });
}

function order(){
  if(cart.length === 0){
    alert("Cart empty ❗");
    return;
  }

  let msg = "COD Order:%0A";

  cart.forEach(item => {
    msg += item.name + " ₹" + item.price + "%0A";
  });

  msg += "Total ₹" + total;

  window.open("https://wa.me/917209154067?text=" + msg);
}
</script>

</body>
</html>￼Enter
